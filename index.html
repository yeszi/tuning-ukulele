<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ukulele Tuner TS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>🎵 Ukulele Tuner (TypeScript)</h1>

  <div class="tuner-box">
      <h2>Current Note</h2>
      <div id="note">--</div>

      <h3>Frequency: <span id="freq">0</span> Hz</h3>
      <h3>Status: <span id="status">-</span></h3>
  </div>

  <button id="startBtn">Start Tuning</button>

  <script src="dist/main.js"></script>
</body>
</html>
