<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UkCozy – Tuner & Chord Detector</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-container">

    <!-- Header -->
    <header class="header">
        <h1>🎀 UkCozy</h1>
        <h2>Tuner + Chord Detector</h2>
        <button id="themeToggle" class="toggle-btn">🌙</button>
    </header>

    <!-- Chord Card -->
    <section class="card chord-card glass">
        <div class="label">Realtime Chord</div>
        <div id="chordLabel" class="chord">--</div>
        <div id="chordScore" class="score">Score: -</div>
    </section>

    <!-- Mode Selector -->
    <section class="card glass small-card">
        <label>Mode</label>
        <select id="modeSelect">
            <option value="both">Chord + Tuner</option>
            <option value="chord">Chord Only</option>
            <option value="tuner">Tuner Only</option>
        </select>
    </section>

    <!-- Start Button -->
    <button id="startBtn" class="start-btn">START</button>

    <!-- Visualizers -->
    <section class="card glass">
        <h3>Visualizer</h3>
        <div class="canvas-row">
            <canvas id="spectroCanvas"></canvas>
            <canvas id="chromaCanvas"></canvas>
        </div>
    </section>

    <!-- Tuner Section -->
    <section class="card glass">
        <h3>Tuner (Ukulele)</h3>

        <div class="tuner-grid">
            <div class="string">
                <div>G4</div>
                <div class="needle-box"><div id="needleG" class="needle"></div></div>
                <div id="freqG">- Hz</div>
            </div>

            <div class="string">
                <div>C4</div>
                <div class="needle-box"><div id="needleC" class="needle"></div></div>
                <div id="freqC">- Hz</div>
            </div>

            <div class="string">
                <div>E4</div>
                <div class="needle-box"><div id="needleE" class="needle"></div></div>
                <div id="freqE">- Hz</div>
            </div>

            <div class="string">
                <div>A4</div>
                <div class="needle-box"><div id="needleA" class="needle"></div></div>
                <div id="freqA">- Hz</div>
            </div>
        </div>
    </section>

    <!-- Controls -->
    <section class="card glass small-card">
        <h3>Controls</h3>

        <label>Sensitivity</label>
        <input id="threshold" type="range" min="0" max="100" value="30" />

        <label>Chroma Threshold</label>
        <input id="chromaThresh" type="range" min="0" max="100" value="50" />
    </section>

    <!-- Log Window -->
    <section class="card glass">
        <h3>Log</h3>
        <pre id="log" class="logbox"></pre>
    </section>

</div>

<script src="ui.js"></script>
<script type="module" src=".dist/main.js"></script>
</body>
</html>
